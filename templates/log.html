{% extends 'base.html' %}

{% block head %}

{% endblock %}


{% block body %}
<div class="container pt-4">
    <div class="row">
        <div class="col-6">
            <table id="statTable" class="display" style="border: 1px solid black; border-collapse: collapse;">
                <thead>
                <tr>
                    <th>Information</th>
                    <th>Count</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Times Make Prediction was clicked:</td>
                    <td style="text-align: center">{{ press_counter }}</td>
                </tr>
                <tr>
                    <td>Successful predictions (number of drugs):</td>
                    <td style="text-align: center">{{ success_counter }}</td>
                </tr>
                <tr>
                    <td>Failed predictions (invalid input):</td>
                    <td style="text-align: center">{{ failure_counter }}</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
